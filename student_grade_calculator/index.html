<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🎓 Student Grade Calculator</h1>
            <p>Enter your marks and calculate your academic performance.</p>
        </div>

        <div class="calculator">

            <div class="input-section">

                <h2>Enter Your Marks</h2>

                <label for="math">Mathematics</label>
                <input type="number" id="math" min="0" max="100" placeholder="Enter mark">

                <label for="programming">Programming</label>
                <input type="number" id="programming" min="0" max="100" placeholder="Enter mark">

                <label for="database">Database Systems</label>
                <input type="number" id="database" min="0" max="100" placeholder="Enter mark">

                <label for="networking">Networking</label>
                <input type="number" id="networking" min="0" max="100" placeholder="Enter mark">

                <label for="web">Web Development</label>
                <input type="number" id="web" min="0" max="100" placeholder="Enter mark">

                <button onclick="calculateGrade()">Calculate Grade</button>

                <button class="clear-btn" onclick="clearForm()">Clear</button>

            </div>

            <div class="result-section">

                <h2>Your Results</h2>

                <div class="result-box">
                    <p>Total Marks</p>
                    <h3 id="total">--</h3>
                </div>

                <div class="result-box">
                    <p>Average</p>
                    <h3 id="average">--</h3>
                </div>

                <div class="result-box">
                    <p>Grade</p>
                    <h3 id="grade">--</h3>
                </div>

                <div class="result-box">
                    <p>Result</p>
                    <h3 id="result">--</h3>
                </div>

            </div>

        </div>

        <footer>
            <p>Student Grade Calculator | Created with HTML, CSS & JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
